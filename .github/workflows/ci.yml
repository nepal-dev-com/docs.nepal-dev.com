# Checks only: this workflow never publishes and holds no secret (ADR-0047).
# Vercel alone publishes, on a push to main (ADR-0042).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only for every job; a job is given more only where it must be.
permissions:
  contents: read

# A newer run of the same pull request cancels the older one; runs on main all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Node of package.json's engines.node, which Vercel builds with (ADR-0043).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      # Moves by hand, together with @types/bun in package.json (ADR-0047 decision 6).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run types:check
      # Never `bun run build`: that pushes every page to the live search index.
      - run: bunx next build

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # A licence outside this list is a question for the owner (ADR-0047 decision 3).
          allow-licenses: MIT, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, CC0-1.0, Unlicense, BlueOak-1.0.0, MPL-2.0, CC-BY-4.0, Python-2.0
          comment-summary-in-pr: never
