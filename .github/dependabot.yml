# One grouped update a week, a week old at the least (ADR-0047 decision 6).
# Nothing merges by itself: a merge to main publishes (ADR-0042).
version: 2

updates:
  - package-ecosystem: bun
    # The root only: .agent-skills/ holds vendored skills with manifests of their own.
    directory: /
    schedule:
      interval: weekly
      day: monday
    # A release younger than this is not proposed. Security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Moves by hand, together with the Bun version in .github/workflows/ci.yml.
      - dependency-name: '@types/bun'
      # Follows engines.node in package.json (ADR-0043).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore(deps)
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: chore(deps)
    labels: [dependencies]
