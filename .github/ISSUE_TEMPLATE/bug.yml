name: Bug
description: Something on the site or in the build does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste secrets, tokens or private content. For a security problem, use the security policy instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw, and what you expected.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: The page address, or the file and command.
      placeholder: https://docs.nepal-dev.com/docs or `bunx next build`
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Press …
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device, or Bun and Node versions
